name: Monthly SEO Rebuild

on:
  schedule:
    - cron: '0 0 1 * *' # Run on the 1st of every month at 00:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Needed for pushing empty commit

jobs:
  rebuild:
    name: Push Empty Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Trigger Git Deploy (Empty Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Chore: Monthly SEO Auto-Rebuild (UTC: $(date -u))"
          git push origin HEAD
